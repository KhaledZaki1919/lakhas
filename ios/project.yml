# XcodeGen spec — "lite" variant: the app only, no extensions (ADR-012, ADR-014).
# project.full.yml includes this file and adds the widget + share extensions.
# Never hand-edit the generated Lakhas.xcodeproj.
name: Lakhas
options:
  bundleIdPrefix: com.khaled
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 language mode with minimal concurrency checking (ADR-019).
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # No team: Simulator builds are ad-hoc signed ("-"); device builds run with
    # CODE_SIGNING_ALLOWED=NO and are signed by Sideloadly at install time.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LAKHAS_API_BASE_URL: "https://api.lakhas.invalid"

packages:
  LakhasKit:
    path: LakhasKit

targets:
  Lakhas:
    type: application
    platform: iOS
    sources:
      - path: Lakhas
    dependencies:
      - package: LakhasKit
        product: LakhasKit
    entitlements:
      path: Config/Lakhas.entitlements
      # XcodeGen writes this file from `properties` on every generate.
      properties:
        com.apple.security.application-groups: [group.com.khaled.lakhas]
    info:
      path: Lakhas/Info.plist
      properties:
        CFBundleDisplayName: "لخّص"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        # Must be non-empty: XcodeGen drops empty dictionaries, and without this key iOS
        # runs the app letterboxed in legacy mode. CI verifies it (scripts/build-ipa.sh).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "نحتاج الكاميرا لتصوير وجباتك ومسح الباركود."
        LakhasAppGroup: group.com.khaled.lakhas
        LakhasAPIBaseURL: $(LAKHAS_API_BASE_URL)
        # SPKI SHA-256 pins of the CA roots Cloudflare may use for our edge certificate
        # (ADR-005). Rotation: docs/runbooks/pinning.md.
        LakhasPinnedSPKI:
          - C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M=   # ISRG Root X1 (Let's Encrypt)
          - diGVwiVYbubAI3RW4hB9xU8e/CH2GnkuvVFZE8zmgzI=   # ISRG Root X2 (Let's Encrypt)
          - hxqRlPTu1bMS/0DITB1SSu0vd4u/8l8TjPgfaAp63Gc=   # GTS Root R1 (Google Trust Services)
          - Vfd95BwDeSQo+NUYxVEEIlvkOlWY2SalKK1lPhzOx78=   # GTS Root R2
          - QXnt2YHvdHR3tJYmQIr0Paosp6t/nggsEGD4QJZ3Q0g=   # GTS Root R3
          - mEflZT5enoR1FuXLgYYGqnVEoZvmf9c2bVBpiOjYQ0c=   # GTS Root R4
          - K89VOmb1cJAN3TK6bf4ezAbJGC1mLcG2Dh97dnwr3VQ=   # SSL.com TLS RSA Root CA 2022
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khaled.lakhas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LakhasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LakhasTests
    dependencies:
      - target: Lakhas
      - package: LakhasKit
        product: LakhasKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khaled.lakhas.tests
        GENERATE_INFOPLIST_FILE: YES

  LakhasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LakhasUITests
    dependencies:
      - target: Lakhas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khaled.lakhas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lakhas

schemes:
  Lakhas:
    build:
      targets:
        Lakhas: all
        LakhasTests: [test]
        LakhasUITests: [test]
    test:
      config: Debug
      targets:
        - LakhasTests
        - LakhasUITests
