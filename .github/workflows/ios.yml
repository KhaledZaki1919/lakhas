# iOS CI (ADR-012). Order: fast compile-only build (all errors, full log as artifact) →
# tests → unsigned IPAs. SwiftLint runs in parallel and never blocks the build (ADR-019).
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "shared/test-vectors/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "shared/test-vectors/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

jobs:
  build:
    name: Compile (Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Localization check
        run: python3 scripts/check-strings.py

      - name: Generate project (full)
        run: xcodegen generate --spec project.full.yml

      - name: Build app, extensions and test bundles (no tests)
        run: |
          mkdir -p build
          # Keep compiling other files after the first error so one run shows them all.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          status=0
          xcodebuild build-for-testing \
            -project Lakhas.xcodeproj -scheme Lakhas \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E '\*\* (TEST )?BUILD (SUCCEEDED|FAILED) \*\*' build/xcodebuild.log || tail -n 40 build/xcodebuild.log
          if [ "$status" -ne 0 ]; then
            echo "::group::All compiler errors (de-duplicated)"
            grep -E "error:" build/xcodebuild.log | sort -u
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          retention-days: 7

  lint:
    name: SwiftLint (non-blocking)
    runs-on: macos-15
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint --quiet

  test:
    name: Tests
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: LakhasKit tests
        run: swift test --package-path LakhasKit

      - name: Generate project (full)
        run: xcodegen generate --spec project.full.yml

      - name: App and UI tests (Simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick-simulator.py)
          xcodebuild test \
            -project Lakhas.xcodeproj -scheme Lakhas \
            -destination "id=$UDID" \
            -resultBundlePath build/TestResults.xcresult \
            -quiet

      - name: Test summary
        if: always()
        run: |
          [ -d build/TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --compact > build/summary.json
          python3 - <<'PY'
          import json
          s = json.load(open("build/summary.json"))
          print(f"App tests: {s['passedTests']} passed, {s['failedTests']} failed, {s['skippedTests']} skipped of {s['totalTestCount']}")
          for f in s.get("testFailures", []):
              print(f"FAILED {f.get('testIdentifierString', f.get('testName'))}: {f.get('failureText')}")
          assert s["totalTestCount"] >= 3 and s["failedTests"] == 0, "expected at least 3 passing app tests"
          PY

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ios/build/TestResults.xcresult
          retention-days: 7

  ipa:
    name: IPA (${{ matrix.variant }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [full, lite]
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec ${{ matrix.variant == 'full' && 'project.full.yml' || 'project.yml' }}

      - name: Build (unsigned, Release)
        run: |
          xcodebuild build \
            -project Lakhas.xcodeproj -scheme Lakhas \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet

      - name: Package IPA
        run: bash scripts/build-ipa.sh build/DerivedData/Build/Products/Release-iphoneos/Lakhas.app build/Lakhas-${{ matrix.variant }}.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lakhas-${{ matrix.variant }}
          path: ios/build/Lakhas-${{ matrix.variant }}.ipa
          if-no-files-found: error
          retention-days: 30
