name: Backend

# Cloudflare Workers lakhas-api + lakhas-admin (ADR-027). CI never deploys: deploys and
# remote migrations are run by the owner with wrangler.
on:
  push:
    branches: [main]
    paths: ["backend/**", "shared/test-vectors/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "shared/test-vectors/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Lint, typecheck, test, dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dry

      - name: Shared test vectors are up to date
        working-directory: shared/test-vectors
        run: |
          node generate-signing.mjs
          node generate-account-keys.mjs
          git diff --exit-code -- signing.json account-keys.json
